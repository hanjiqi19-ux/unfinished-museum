<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>未完成博物馆</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at top,#393025,#0b121c 65%);color:#e9dbb9;font-family:serif}main{max-width:600px;padding:36px;text-align:center}h1{letter-spacing:.15em;font-weight:400}p{line-height:1.9}button{background:#b79756;color:#111a23;border:0;border-radius:24px;padding:12px 24px;cursor:pointer}</style></head><body><main><p aria-hidden="true">✧</p><h1>未完成博物馆</h1><p id="status" role="status">正在为你点亮展馆…</p><button id="retry" hidden>重新打开</button><noscript>请启用 JavaScript 后打开这座展馆。</noscript></main><script>(async()=>{
 const parts=[{"name":"museum-01.txt","size":699000},{"name":"museum-02.txt","size":699000},{"name":"museum-03.txt","size":699000},{"name":"museum-04.txt","size":699000},{"name":"museum-05.txt","size":699000},{"name":"museum-06.txt","size":699000},{"name":"museum-07.txt","size":699000},{"name":"museum-08.txt","size":699000},{"name":"museum-09.txt","size":699000},{"name":"museum-10.txt","size":699000},{"name":"museum-11.txt","size":699000},{"name":"museum-12.txt","size":699000},{"name":"museum-13.txt","size":699000},{"name":"museum-14.txt","size":699000},{"name":"museum-15.txt","size":699000},{"name":"museum-16.txt","size":699000},{"name":"museum-17.txt","size":699000},{"name":"museum-18.txt","size":699000},{"name":"museum-19.txt","size":699000},{"name":"museum-20.txt","size":699000},{"name":"museum-21.txt","size":699000},{"name":"museum-22.txt","size":699000},{"name":"museum-23.txt","size":683688}],expected='48647e3378929dde74d4dd438e7696e3f8e0c05dff033fd48954e6e5fe62ddb5',status=document.getElementById('status'),retry=document.getElementById('retry');
 retry.onclick=()=>location.reload();
 try{
  const chunks=new Array(parts.length);let next=0,done=0;
  async function worker(){while(next<parts.length){const i=next++,part=parts[i];const response=await fetch(part.name+'?v='+expected.slice(0,12),{cache:'no-store'});if(!response.ok)throw Error('无法读取 '+part.name+'（'+response.status+'），请检查这些文件是否全部上传到仓库根目录。');const b=await response.arrayBuffer();if(b.byteLength!==part.size)throw Error(part.name+' 内容不完整，请重新上传该文件。');chunks[i]=new Uint8Array(b);status.textContent='正在点亮展馆 · '+(++done)+' / '+parts.length;}}
  await Promise.all(Array.from({length:4},worker));
  const all=new Uint8Array(16061688);let offset=0;for(const b of chunks){all.set(b,offset);offset+=b.length;}
  if(!globalThis.crypto?.subtle)throw Error('请使用 HTTPS 地址及新版浏览器打开。');
  const digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',all)),x=>x.toString(16).padStart(2,'0')).join('');
  if(digest!==expected)throw Error('网站文件版本不一致，请将同一份压缩包的全部文件上传后重试。');
  const html=new TextDecoder('utf-8',{fatal:true}).decode(all);document.open();document.write(html);document.close();
 }catch(e){status.textContent='展馆暂时无法打开：'+e.message;retry.hidden=false;}
})();</script></body></html>
